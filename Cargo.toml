[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["RustUse Contributors"]
categories = ["algorithms", "finance", "internationalization", "mathematics"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RustUse/use-quant"
rust-version = "1.95.0"

[workspace.dependencies]
use-bar = { version = "0.2.0", path = "crates/use-bar" }
use-drawdown = { version = "0.2.0", path = "crates/use-drawdown" }
use-factor = { version = "0.2.0", path = "crates/use-factor" }
use-market-price = { version = "0.2.0", path = "crates/use-market-price" }
use-portfolio-weight = { version = "0.2.0", path = "crates/use-portfolio-weight" }
use-price-series = { version = "0.2.0", path = "crates/use-price-series" }
use-return = { version = "0.2.0", path = "crates/use-return" }
use-risk = { version = "0.2.0", path = "crates/use-risk" }
use-signal-score = { version = "0.2.0", path = "crates/use-signal-score" }
use-tick = { version = "0.2.0", path = "crates/use-tick" }
use-volatility = { version = "0.2.0", path = "crates/use-volatility" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
derivable_impls = "allow"
doc_markdown = "allow"
expect_used = "warn"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
must_use_candidate = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
return_self_not_must_use = "allow"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
