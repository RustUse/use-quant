name: Facade Publish Readiness

on:
  workflow_dispatch:
    inputs:
      registry-ready:
        description: Confirm that matching focused-crate versions are live on crates.io
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  facade-release-readiness:
    if: ${{ inputs['registry-ready'] }}
    name: Facade Publish Dry Run
    runs-on: ubuntu-24.04

    env:
      FOCUSED_CRATES: >-
        use-market-price use-return use-bar use-tick use-price-series
        use-volatility use-drawdown use-portfolio-weight use-factor
        use-signal-score use-risk

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-workspaces: |
            . -> target

      - name: Confirm focused crate versions are visible on crates.io
        shell: bash
        run: |
          set -euo pipefail

          version="$(cargo metadata --format-version 1 --no-deps \
            | python -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")"

          echo "Expected version: ${version}"

          for crate in $FOCUSED_CRATES; do
            echo "Checking ${crate} ${version} on crates.io..."
            curl --fail --silent --show-error \
              "https://crates.io/api/v1/crates/${crate}/${version}" > /dev/null
          done

      - name: List packaged facade files
        run: cargo package --list -p use-quant

      - name: Dry-run publish use-quant
        run: cargo publish --dry-run --locked --allow-dirty -p use-quant
